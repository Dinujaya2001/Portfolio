<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dinujaya Tharaka - Software Engineer & Backend Developer Portfolio">
    <title>Dinujaya Tharaka | Software Engineer</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class', // මේක අනිවාර්යයි
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0F172A',
                        brandBlue: '#2563EB',
                        brandSky: '#38BDF8',
                        brandCyan: '#06B6D4',
                    },
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                        space: ['Space Grotesk', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Instant Theme Injector Script (Flicker එක නැති කිරීමට) -->
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <!-- AOS Animation Library -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/animation.css">
</head>

<body class="bg-slate-900 text-slate-100 font-inter antialiased selection:bg-brandBlue selection:text-white min-h-screen flex flex-col justify-between transition-colors duration-300">

        <nav class="glass-card border-b border-slate-800/50 bg-slate-900/80 backdrop-blur-md">

                <div class="flex items-center justify-between h-16">

                    <!-- Brand Logo -->
                    <a href="index.html" class="flex items-center gap-2 group">
                        <span class="w-9 h-9 rounded-lg bg-gradient-to-tr from-brandBlue to-brandSky flex items-center justify-center text-white font-space font-bold text-lg shadow-lg shadow-brandBlue/30 group-hover:scale-105 transition-transform duration-300">
                            N
                        </span>

                        </span>

                    <div class="hidden md:flex items-center space-x-1 lg:space-x-2">

                            Home

                        <a href="about.html" class="nav-link px-3 py-2 rounded-md text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/40 transition-all duration-200">
                            About
                        </a>
                        <a href="projects.html" class="nav-link px-3 py-2 rounded-md text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/40 transition-all duration-200">
                            Projects
                        </a>
                        <a href="contact.html" class="nav-link px-3 py-2 rounded-md text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/40 transition-all duration-200">
                            Contact
                        </a>
                    </div>

                    <!-- Right Action Buttons (Theme Toggle & Mobile Menu Toggle) -->
                    <div class="flex items-center gap-3">
                        <!-- Dark/Light Theme Toggle Button -->
                        <button id="theme-toggle" type="button" aria-label="Toggle Theme" class="p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/60 border border-slate-800 focus:outline-none transition-all duration-200">
                            <i id="theme-toggle-dark-icon" class="fa-solid fa-moon text-lg hidden"></i>
                            <i id="theme-toggle-light-icon" class="fa-solid fa-sun text-lg"></i>

                        <!-- Mobile Hamburger Button -->
                        <button id="mobile-menu-btn" type="button" aria-label="Toggle Mobile Menu" class="md:hidden p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/60 border border-slate-800 focus:outline-none transition-all duration-200">
                            <i class="fa-solid fa-bars text-xl" id="menu-icon"></i>
                        </button>
                    </div>

                </div>
            </div>

            <!-- Mobile Drawer Menu Dropdown -->
            <div id="mobile-menu" class="hidden md:hidden border-t border-slate-800/60 bg-slate-900/95 backdrop-blur-xl px-4 pt-3 pb-5 space-y-2">
                <a href="index.html" class="block px-3 py-2.5 rounded-lg text-base font-medium text-brandSky bg-slate-800/80 border border-slate-700/50">

    <!-- Main Content Area -->

        <h1 class="text-3xl font-bold font-space text-brandSky">Ready for Lesson 03</h1>
    </main>

</html>
